<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1150" viewBox="0 0 1340 1150" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="1340" height="1150" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#334155"/></marker></defs>
<text x="670.0" y="36" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="700">δ — comparator 의 기준선이 정지점보다 얼마나 위인가</text>
<text x="670.0" y="60" text-anchor="middle" font-size="13" fill="#64748b">저항 두 개로 만드는 값이고, 동료에게 넘길 스펙이다. 그런데 seed 를 바꾸면 2.4배 흔들렸다.</text>
<rect x="40" y="86" width="620" height="330" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="60" y="114" text-anchor="start" font-size="15" fill="#0f172a" font-weight="700">A. 회로에서 — detector 출력의 좌표계</text>
<line x1="110" y1="376" x2="620" y2="376" stroke="#334155" stroke-width="2"/>
<text x="102" y="381" text-anchor="end" font-size="11" fill="#0f172a" font-weight="700">917.8 mV</text>
<text x="102" y="397" text-anchor="end" font-size="10" fill="#64748b">quiescent</text>
<text x="102" y="411" text-anchor="end" font-size="9.5" fill="#64748b">(무신호)</text>
<path d="M 150 376 C 190 376 205 176 245 176 C 300 176 315 346 380 358 L 480 366 L 480 376 Z" fill="#1e3a8a" opacity="0.18"/>
<path d="M 150 376 C 190 376 205 176 245 176 C 300 176 315 346 380 358 L 480 366" fill="none" stroke="#1e3a8a" stroke-width="2"/>
<text x="280" y="164" text-anchor="middle" font-size="11.5" fill="#1e3a8a" font-weight="700">envelope (V_env,c)</text>
<line x1="245" y1="176" x2="245" y2="376" stroke="#1e3a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="255" y="276.0" text-anchor="start" font-size="11" fill="#1e3a8a">전형 상승 32 mV</text>
<line x1="130" y1="374" x2="540" y2="374" stroke="#dc2626" stroke-width="2"/>
<text x="548" y="370" text-anchor="start" font-size="11.5" fill="#dc2626" font-weight="700">V_ref</text>
<text x="548" y="385" text-anchor="start" font-size="9.5" fill="#dc2626">= 정지점 + δ</text>
<text x="350" y="408" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">δ = 0.108 mV 는 이 그림에서 선 두께보다 얇다 — 그게 결론의 절반이다</text>
<rect x="430" y="132" width="210" height="132" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="535" y="152" text-anchor="middle" font-size="10.5" fill="#dc2626" font-weight="700">×300 확대</text>
<line x1="450" y1="234" x2="620" y2="234" stroke="#334155" stroke-width="2"/>
<text x="444" y="238" text-anchor="end" font-size="9.5" fill="#64748b">0</text>
<line x1="450" y1="208" x2="620" y2="208" stroke="#dc2626" stroke-width="2"/>
<text x="444" y="212" text-anchor="end" font-size="11" fill="#dc2626" font-weight="700">δ</text>
<text x="535" y="202" text-anchor="middle" font-size="9.5" fill="#dc2626">0.108 mV</text>
<text x="535" y="252" text-anchor="middle" font-size="9.5" fill="#64748b">= 전형 상승의 0.34%</text>
<rect x="680" y="86" width="620" height="330" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="700" y="114" text-anchor="start" font-size="15" fill="#1e3a8a" font-weight="700">B. 수식에서 — 왜 나눗셈에 나타나나</text>
<text x="700" y="136" text-anchor="start" font-size="11.5" fill="#64748b">저항 divider 가 만들 수 있는 건 linear mix 뿐이다.</text>
<text x="700" y="170" text-anchor="start" font-size="13" fill="#0f172a" font-weight="700" font-family="ui-monospace,Menlo,monospace">V_thr,c = α_c · V_max + (1−α_c) · V_ref</text>
<text x="700" y="187" text-anchor="start" font-size="10" fill="#64748b">divider 가 실제로 만드는 것</text>
<text x="700" y="216" text-anchor="start" font-size="13" fill="#0f172a" font-weight="700" font-family="ui-monospace,Menlo,monospace">V_env,c &gt; V_thr,c</text>
<text x="700" y="233" text-anchor="start" font-size="10" fill="#64748b">comparator 발화 조건</text>
<text x="700" y="262" text-anchor="start" font-size="11.5" fill="#64748b">모든 항에서 quiescent 를 뺀다</text>
<text x="700" y="279" text-anchor="start" font-size="10" fill="#64748b">→ '정지점 위 상승' 좌표로</text>
<text x="700" y="308" text-anchor="start" font-size="13" fill="#0f172a" font-weight="700" font-family="ui-monospace,Menlo,monospace">env_c &gt; α_c · S + (1−α_c) · δ</text>
<text x="700" y="325" text-anchor="start" font-size="10" fill="#64748b">S = 채널간 max, δ = V_ref − 정지점</text>
<text x="700" y="354" text-anchor="start" font-size="14" fill="#1e3a8a" font-weight="700" font-family="ui-monospace,Menlo,monospace">(env_c − δ) / (S − δ)  &gt;  α_c</text>
<text x="700" y="371" text-anchor="start" font-size="10" fill="#64748b">← _xmix / _xlse 의 그 줄</text>
<rect x="700" y="378" width="580" height="26" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="990" y="396" text-anchor="middle" font-size="11" fill="#0f172a">δ 는 floor 다 — α=0 이어도 임계가 정확히 δ 이므로, δ 만큼도 못 올라오면 절대 발화 못 한다</text>
<rect x="40" y="440" width="1260" height="430" rx="6" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.4"/>
<text x="60" y="468" text-anchor="start" font-size="15" fill="#dc2626" font-weight="700">C. 왜 안 멈추나 — quantile 이 atom 위에 앉아 있다</text>
<text x="60" y="490" text-anchor="start" font-size="11.5" fill="#64748b">sqrt(mel + 1e-6) 은 √(1e-6) = 0.044 mV 에서 바닥을 친다. 무음·zero padding 프레임이 전부 그 값 하나에 쌓인다 = atom.</text>
<line x1="150" y1="750" x2="1130" y2="750" stroke="#334155" stroke-width="1.6"/>
<line x1="150.0" y1="750" x2="150.0" y2="756" stroke="#334155" stroke-width="1.2"/>
<text x="150.0" y="770" text-anchor="middle" font-size="10" fill="#64748b">0.01</text>
<line x1="346.0" y1="750" x2="346.0" y2="756" stroke="#334155" stroke-width="1.2"/>
<text x="346.0" y="770" text-anchor="middle" font-size="10" fill="#64748b">0.1</text>
<line x1="542.0" y1="750" x2="542.0" y2="756" stroke="#334155" stroke-width="1.2"/>
<text x="542.0" y="770" text-anchor="middle" font-size="10" fill="#64748b">1</text>
<line x1="738.0" y1="750" x2="738.0" y2="756" stroke="#334155" stroke-width="1.2"/>
<text x="738.0" y="770" text-anchor="middle" font-size="10" fill="#64748b">10</text>
<line x1="934.0" y1="750" x2="934.0" y2="756" stroke="#334155" stroke-width="1.2"/>
<text x="934.0" y="770" text-anchor="middle" font-size="10" fill="#64748b">100</text>
<line x1="1130.0" y1="750" x2="1130.0" y2="756" stroke="#334155" stroke-width="1.2"/>
<text x="1130.0" y="770" text-anchor="middle" font-size="10" fill="#64748b">1000</text>
<text x="640.0" y="788" text-anchor="middle" font-size="10.5" fill="#0f172a">정지점 위 상승 (mV, log scale)</text>
