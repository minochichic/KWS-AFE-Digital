<text x="836.7194364004287" y="612" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">speech frames</text>
<text x="836.7194364004287" y="627" text-anchor="middle" font-size="10.5" fill="#1e3a8a">중앙 32 mV</text>
<rect x="267.7354848061992" y="550" width="18" height="200" fill="#dc2626" opacity="0.30" stroke="#dc2626" stroke-width="1.6"/>
<text x="276.7354848061992" y="540" text-anchor="middle" font-size="12.5" fill="#dc2626" font-weight="700">atom</text>
<text x="276.7354848061992" y="524" text-anchor="middle" font-size="10.5" fill="#dc2626">무음 프레임 2.5%</text>
<text x="252.73548480619922" y="630" text-anchor="end" font-size="11" fill="#dc2626" font-weight="700">seed 1234</text>
<text x="252.73548480619922" y="645" text-anchor="end" font-size="10" fill="#dc2626">δ = 0.044 mV</text>
<text x="252.73548480619922" y="659" text-anchor="end" font-size="10" fill="#dc2626">atom 안</text>
<line x1="256.7354848061992" y1="642" x2="265.7354848061992" y2="642" stroke="#dc2626" stroke-width="1.2"/>
<line x1="352.66389076859014" y1="590" x2="352.66389076859014" y2="750" stroke="#9a3412" stroke-width="2" stroke-dasharray="5 3"/>
<text x="362.66389076859014" y="600" text-anchor="start" font-size="11" fill="#9a3412" font-weight="700">seed 1235</text>
<text x="362.66389076859014" y="615" text-anchor="start" font-size="10" fill="#9a3412">δ = 0.108 mV</text>
<text x="362.66389076859014" y="629" text-anchor="start" font-size="10" fill="#9a3412">atom 밖</text>
<line x1="276.7354848061992" y1="704" x2="352.66389076859014" y2="704" stroke="#dc2626" stroke-width="1.8"/>
<line x1="276.7354848061992" y1="699" x2="276.7354848061992" y2="709" stroke="#dc2626" stroke-width="1.8"/>
<line x1="352.66389076859014" y1="699" x2="352.66389076859014" y2="709" stroke="#dc2626" stroke-width="1.8"/>
<text x="314.6996877873947" y="695" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">2.4배</text>
<rect x="60" y="792" width="600" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.1"/>
<text x="72" y="813" text-anchor="start" font-size="12" fill="#dc2626" font-weight="700">무음 프레임 2.5%   vs   xmax_floor_frac 2.0%</text>
<text x="72" y="831" text-anchor="start" font-size="10.5" fill="#0f172a">2% quantile 을 요구하는데 무음이 2.5% → quantile 이 atom 안으로 들어간다</text>
<rect x="680" y="792" width="620" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.1"/>
<text x="692" y="813" text-anchor="start" font-size="12" fill="#dc2626" font-weight="700">표본을 늘려도 절벽은 안 움직인다</text>
<text x="692" y="831" text-anchor="start" font-size="10.5" fill="#0f172a">분산은 줄지만 quantile 은 여전히 discontinuity 위다 → floor_frac 을 올려야 한다</text>
<rect x="40" y="894" width="1260" height="226" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="60" y="922" text-anchor="start" font-size="15" fill="#15803d" font-weight="700">D. 그래서 동료에게 뭐라고 하나</text>
<rect x="60" y="938" width="600" height="76" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.1"/>
<text x="72" y="960" text-anchor="start" font-size="12.5" fill="#15803d" font-weight="700">0.1 mV 를 저항으로 맞추라는 건 불가능하다</text>
<text x="72" y="980" text-anchor="start" font-size="11" fill="#0f172a">저항 공차도 op-amp offset 도 그보다 훨씬 크다.</text>
<text x="72" y="998" text-anchor="start" font-size="11" fill="#0f172a">그런데 맞출 필요가 없다 — 오른쪽이 이유다.</text>
<rect x="680" y="938" width="620" height="76" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.1"/>
<text x="692" y="960" text-anchor="start" font-size="12.5" fill="#15803d" font-weight="700" font-family="ui-monospace,Menlo,monospace">δ ≈ 0 이면  (env−δ)/(S−δ) ≈ env/S</text>
<text x="692" y="980" text-anchor="start" font-size="11" fill="#0f172a">floor 가 사실상 아무 일도 안 한다.</text>
<text x="692" y="998" text-anchor="start" font-size="11" fill="#0f172a">→ V_ref 를 detector 정지점(917.8 mV)에 두면 된다.</text>
<text x="670" y="1036" text-anchor="middle" font-size="12.5" fill="#15803d" font-weight="700">실제 일은 학습된 α 16개가 한다. δ 는 그 위에 얹힌 아주 얇은 floor 일 뿐이다.</text>
<text x="70" y="1068" text-anchor="start" font-size="11.5" fill="#7e22ce" font-weight="700">① floor_frac 을 0.03~0.05 로</text>
<text x="320" y="1068" text-anchor="start" font-size="10.5" fill="#64748b">δ 가 atom 을 벗어나 조용한 음성을 재게 된다. 단 xmix 에서 0.05 는 채널 4개를 죽였다 — xlse 에서 재확인 필요</text>
<text x="70" y="1094" text-anchor="start" font-size="11.5" fill="#7e22ce" font-weight="700">② δ = 0 으로 확정</text>
<text x="320" y="1094" text-anchor="start" font-size="10.5" fill="#64748b">어차피 0.34%다. 회로가 단순해지고(V_ref = 정지점) 불안정성이 원천 제거된다. 무음에서 잡음÷잡음이 되는지만 확인</text>
<text x="40" y="1134" text-anchor="start" font-size="10" fill="#64748b">환산 앵커: lse_temp 0.58329 ≡ n·V_T 25.85 mV → 1 code = 44.3 mV (검산: TYP → 31.9 mV ≈ 요구 33 mV) · 생성: docs/diagrams/make_delta.py</text>
</svg>