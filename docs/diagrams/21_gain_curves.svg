<text x="474" y="592" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="start" font-weight="400">· −18 dB 에서 fixed 는 0.248 로 무너진다 (우연 0.083). xlse 는 0.632.</text>
<text x="474" y="607" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="start" font-weight="400">· 절대 임계는 소리가 작아지면 아무 채널도 안 켜져 이미지가 통째로 −1 이 된다.</text>
<text x="474" y="622" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="start" font-weight="400">· 다이오드-OR 은 분모도 같이 작아지므로 상대 패턴이 남는다.</text>
<text x="474" y="637" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="start" font-weight="400">· 증강으로 낙폭이 안 줄었다 (50.6 → 50.0pp). 상쇄할 분모가 없기 때문.</text>
<text x="474" y="652" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="start" font-weight="400">· 최고점이 0 dB 가 아닌 +6/+12 dB — 학습 지점에서 이미 비트가 모자란다.</text>
