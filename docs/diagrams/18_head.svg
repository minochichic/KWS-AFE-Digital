<text x="722" y="526" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">이득이 크면 교차가 가팔라 밴드를 빨리 빠져나간다.</text>
<text x="722" y="552" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#7e22ce" text-anchor="start" font-weight="600">이득 1.6 → 351 µs   4.7 → 405 µs   10 → 25 µs</text>
<rect x="40" y="612" width="1280" height="428" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
<text x="66" y="648" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#9a3412" text-anchor="start" font-weight="700">두 지표가 이득에 대해 반대로 말한다</text>
<text x="70" y="686" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">이득 ↑</text>
<text x="150" y="686" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#334155" text-anchor="start" font-weight="400">산포 = (R5/R4)·Vos 가 같이 커진다</text>
<text x="680" y="686" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="start" font-weight="700">LEVEL 나빠짐</text>
<text x="70" y="716" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">이득 ↑</text>
<text x="150" y="716" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#334155" text-anchor="start" font-weight="400">교차가 가팔라져 밴드 통과가 빨라진다</text>
<text x="680" y="716" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#15803d" text-anchor="start" font-weight="700">SLOPE 좋아짐</text>
<text x="70" y="746" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">이득 ↓</text>
<text x="150" y="746" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#334155" text-anchor="start" font-weight="400">산포가 준다</text>
<text x="680" y="746" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#15803d" text-anchor="start" font-weight="700">LEVEL 좋아짐</text>
<text x="70" y="776" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">이득 ↓</text>
<text x="150" y="776" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#334155" text-anchor="start" font-weight="400">교차가 완만해져 밴드 안에 오래 머문다</text>
<text x="680" y="776" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="start" font-weight="700">SLOPE 나빠짐</text>
<text x="66" y="828" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">빠져나갈 곳은 이득이 아니다. 마진(α·T·ln16)도 비교기 오프셋도 고정 전압이라,</text>
<text x="66" y="854" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">이득을 어느 쪽으로 돌려도 한쪽을 사고 다른 쪽을 판다. max 산포 13.1 mV 중 6 mV 는 비교기 몫이고</text>
<text x="66" y="880" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#0f172a" text-anchor="start" font-weight="600">그건 (R5/R4) 가 안 곱해져서 이득으로는 손도 못 댄다. → 비교기 부품이나 브링업 트림.</text>
