<text x="44" y="406" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="start" font-weight="400">활성 평면 [채널, 프레임] 을 온칩 메모리에 통째로 둔다. 필요할 때 주소로 꺼내 쓴다.</text>
