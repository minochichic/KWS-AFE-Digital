<text x="86" y="310" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11" fill="#1c2333" text-anchor="start" font-weight="400">kws_block 하나에서 이걸로 버그 두 개가 났다 — 지연선 깊이 off-by-one (103/128 실패), drain 이 하류로 안 전파.</text>
<text x="86" y="326" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11" fill="#5b6478" text-anchor="start" font-weight="400">층이 21개면 그런 접점이 20개다.</text>
