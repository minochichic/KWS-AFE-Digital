<text x="44" y="103" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="14.5" fill="#1c2333" text-anchor="start" font-weight="700">A.  스트리밍 = 컨베이어 벨트</text>
<text x="44" y="122" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="start" font-weight="400">활성이 프레임 단위로 흘러간다. 층이 필요한 것은 그 순간 손에 들고 있어야 한다 — 그게 line buffer 다.</text>
