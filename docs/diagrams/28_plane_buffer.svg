<text x="620.0" y="36" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="21" fill="#1c2333" text-anchor="middle" font-weight="700">층 사이를 어떻게 잇나 — 컨베이어 vs 창고</text>
<text x="620.0" y="58" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12.5" fill="#5b6478" text-anchor="middle" font-weight="400">21개 층이 활성을 서로에게 넘기는 방식. 층 안에서는 스트리밍이 맞는데, 층 사이에서는 얘기가 다르다.</text>
