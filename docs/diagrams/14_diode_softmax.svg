<text x="340" y="700" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">분모가 1.02배 부풀었다</text>
<text x="340" y="722" text-anchor="middle" font-size="11.5" fill="#0f172a">실제로 분모에 기여한 채널 1.2개 / 16개</text>
<text x="340" y="744" text-anchor="middle" font-size="11.5" fill="#15803d">→ 사실상 진짜 max. 문제 없음</text>
