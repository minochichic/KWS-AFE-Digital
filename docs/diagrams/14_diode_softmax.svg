<rect width="1300" height="1010" fill="#ffffff"/>
<text x="650.0" y="36" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="700">다이오드-OR은 왜 "제일 큰 값"을 못 주나</text>
<text x="650.0" y="60" text-anchor="middle" font-size="13" fill="#64748b">다이오드는 스위치가 아니라 폭 26 mV짜리 흐릿한 밸브다. 그 폭은 물리가 고정하고, 목소리 크기는 안 그렇다.</text>
<rect x="40" y="84" width="610" height="176" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="60" y="110" text-anchor="start" font-size="15" fill="#15803d" font-weight="700">우리가 기대한 것 — 스위치</text>
<rect x="90" y="158" width="44" height="54" rx="3" fill="#15803d" opacity="0.75"/>
<text x="112" y="230" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="700">켜짐</text>
<rect x="220" y="182" width="44" height="30" rx="3" fill="#cbd5e1" opacity="0.5"/>
<text x="242" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">꺼짐</text>
<rect x="350" y="192" width="44" height="20" rx="3" fill="#cbd5e1" opacity="0.5"/>
<text x="372" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">꺼짐</text>
<rect x="480" y="200" width="44" height="12" rx="3" fill="#cbd5e1" opacity="0.5"/>
<text x="502" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">꺼짐</text>
<text x="345" y="250" text-anchor="middle" font-size="12" fill="#15803d" font-weight="700">제일 큰 놈만 통과, 나머지는 완전히 차단</text>
<rect x="670" y="84" width="590" height="176" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
<text x="690" y="110" text-anchor="start" font-size="15" fill="#dc2626" font-weight="700">실제 — 흐릿한 밸브</text>
<rect x="715" y="158" width="44" height="54" rx="3" fill="#dc2626" opacity="0.7"/>
<text x="737" y="230" text-anchor="middle" font-size="10.5" fill="#dc2626">많이</text>
<rect x="840" y="182" width="44" height="30" rx="3" fill="#dc2626" opacity="0.57"/>
<text x="862" y="230" text-anchor="middle" font-size="10.5" fill="#dc2626">조금</text>
<rect x="965" y="192" width="44" height="20" rx="3" fill="#dc2626" opacity="0.43999999999999995"/>
<text x="987" y="230" text-anchor="middle" font-size="10.5" fill="#dc2626">찔끔</text>
<rect x="1090" y="200" width="44" height="12" rx="3" fill="#dc2626" opacity="0.30999999999999994"/>
<text x="1112" y="230" text-anchor="middle" font-size="10.5" fill="#dc2626">찔끔</text>
<text x="965" y="250" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">진 채널도 계속 샌다 → 새는 것들이 합쳐져 노드가 들린다</text>
<rect x="40" y="288" width="1220" height="540" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="60" y="316" text-anchor="start" font-size="16" fill="#1e3a8a" font-weight="700">B. 같은 회로인데 목소리 크기에 따라 딴판이 된다</text>
<text x="60" y="338" text-anchor="start" font-size="11.5" fill="#64748b">두 그래프는 같은 mV 자를 쓴다. 회색 띠(26 mV, 다이오드의 흐린 폭)는 양쪽에서 높이가 똑같고, 막대만 줄어든다 — 그게 전부다.</text>
