<text x="950" y="722" text-anchor="middle" font-size="11.5" fill="#0f172a">실제로 분모에 기여한 채널 4.7개 / 16개</text>
<text x="950" y="744" text-anchor="middle" font-size="11.5" fill="#dc2626">→ 모든 채널이 훨씬 덜 발화한다</text>
<text x="950" y="764" text-anchor="middle" font-size="10.5" fill="#64748b">흐린 폭 / 신호 = 0.55</text>
<text x="650" y="810" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">조용히 말할수록 나빠진다 — 하필 제일 필요한 곳에서.</text>
<rect x="40" y="856" width="1220" height="128" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.4"/>
<text x="60" y="884" text-anchor="start" font-size="16" fill="#7e22ce" font-weight="700">C. 그래서 바꿔야 할 것 두 가지</text>
<text x="70" y="910" text-anchor="start" font-size="12.5" fill="#7e22ce" font-weight="700">1</text>
<text x="88" y="910" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">"흐린 정도"는 우리가 고르는 값이 아니다</text>
<text x="430" y="910" text-anchor="start" font-size="11" fill="#64748b">코드의 lse_temp_frac은 곧 1/음량이다. 하나로 학습하면 한 음량만 배운다.</text>
<text x="70" y="931" text-anchor="start" font-size="12.5" fill="#7e22ce" font-weight="700"></text>
<text x="88" y="931" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">→ 게인 증강을 다시 본다</text>
<text x="430" y="931" text-anchor="start" font-size="11" fill="#64748b">xlse에서 클립 게인을 바꾸는 건 lse_temp_frac을 바꾸는 것과 같다. 예전 기각(−9pp)은 고정 임계 얘기라 여기 적용 안 됨.</text>
<text x="70" y="952" text-anchor="start" font-size="12.5" fill="#7e22ce" font-weight="700">2</text>
<text x="88" y="952" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">spice_gain_restore를 켠다</text>
<text x="430" y="952" text-anchor="start" font-size="11" fill="#64748b">"채널별 threshold가 흡수한다"는 진짜 max에서만 맞다. 소프트 max는 16채널을 한 숫자로 섞으므로,</text>
<text x="70" y="973" text-anchor="start" font-size="12.5" fill="#7e22ce" font-weight="700"></text>
<text x="88" y="973" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700"></text>
<text x="430" y="973" text-anchor="start" font-size="11" fill="#64748b">한 채널의 오차가 모두의 분모를 밀어올린다 — 채널별 상수로는 되돌릴 수 없다.</text>
