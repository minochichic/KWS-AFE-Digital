<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 892" width="1200" height="892">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/></marker></defs>
<rect width="1200" height="892" fill="#ffffff"/>
<text x="600.0" y="36" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="21" fill="#1c2333" text-anchor="middle" font-weight="700">비트폭 — 왜 실측해도 안 줄어들었나</text>
<text x="600.0" y="58" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12.5" fill="#5b6478" text-anchor="middle" font-weight="400">한 문장: 레지스터의 폭은 담는 범위의 log 다. 범위를 37% 줄이면 0.54비트가 줄고, 비트는 쪼갤 수 없다.</text>
<rect x="24" y="78" width="1152" height="156" rx="12" fill="#ffffff" stroke="#c3cbd9" stroke-width="1.2"/>
<text x="44" y="103" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="14.5" fill="#1c2333" text-anchor="start" font-weight="700">A.  레지스터는 칸이 정해진 그릇이다</text>
<rect x="46" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="60" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="80" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="94" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="114" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="128" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="148" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="162" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="182" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="196" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="216" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="230" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="250" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="264" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="284" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="298" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<rect x="318" y="120" width="28" height="30" rx="4" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1"/>
<text x="332" y="140" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">0</text>
<text x="199.0" y="166" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="middle" font-weight="400">9 비트</text>
<text x="400" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="start" font-weight="400">담는 범위</text>
<text x="400" y="144" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#1c2333" text-anchor="start" font-weight="600">8 비트</text>
<text x="470" y="144" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#1c2333" text-anchor="start" font-weight="400">−128 … +127</text>
<text x="400" y="163" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#1c2333" text-anchor="start" font-weight="600">9 비트</text>
<text x="470" y="163" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#1c2333" text-anchor="start" font-weight="400">−256 … +255</text>
<text x="590" y="163" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11" fill="#5b6478" text-anchor="start" font-weight="400">← 한 비트 늘 때마다 범위는 2배</text>
<text x="400" y="182" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#1c2333" text-anchor="start" font-weight="600">10 비트</text>
<text x="470" y="182" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#1c2333" text-anchor="start" font-weight="400">−512 … +511</text>
<rect x="818" y="118" width="342" height="96" rx="8" fill="#fdf0ef" stroke="#cc6155" stroke-width="1.3"/>
<text x="989.0" y="138" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12.5" fill="#a3453a" text-anchor="middle" font-weight="700">넘치면 —  조용히 감싼다</text>
<text x="989.0" y="162" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">8비트에서  127 + 1  =  −128</text>
<text x="989.0" y="184" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="middle" font-weight="400">에러가 안 난다. 정확도만 떨어진다.</text>
<text x="989.0" y="203" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11" fill="#5b6478" text-anchor="middle" font-weight="400">→ 폭은 「일어날 수 있는 최댓값」으로 정한다</text>
<rect x="24" y="250" width="1152" height="132" rx="12" fill="#ffffff" stroke="#c3cbd9" stroke-width="1.2"/>
<text x="44" y="275" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="14.5" fill="#1c2333" text-anchor="start" font-weight="700">B.  이진 누산기의 최댓값은 「잴」 필요가 없다 — 계산된다</text>
<text x="44" y="298" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12.5" fill="#1c2333" text-anchor="start" font-weight="400">입력도 ±1, 가중치도 ±1  →  곱은 언제나 ±1.  그걸 K개 더한다.</text>
<text x="60" y="326" font-family="'SF Mono','Menlo',monospace" font-size="13.5" fill="#1c2333" text-anchor="start" font-weight="400">n  =  (±1) + (±1) + … + (±1)      K개</text>
<text x="60" y="350" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12.5" fill="#1c2333" text-anchor="start" font-weight="600">전부 +1 이면 +K,  전부 −1 이면 −K.  그 밖은 불가능.</text>
<rect x="624" y="290" width="536" height="76" rx="8" fill="#e6f4ea" stroke="#3f9a5d" stroke-width="1.3"/>
<text x="892.0" y="314" font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#1c2333" text-anchor="middle" font-weight="400">b1.subs.0.pw  는  K = 128</text>
<text x="892.0" y="340" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12.5" fill="#1c2333" text-anchor="middle" font-weight="600">경계 ±128  →  9비트.  측정 없이 확정이고, 절대 안 넘친다.</text>
<rect x="24" y="398" width="1152" height="300" rx="12" fill="#ffffff" stroke="#c3cbd9" stroke-width="1.2"/>
<text x="44" y="423" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="14.5" fill="#1c2333" text-anchor="start" font-weight="700">C.  ★ 그런데 비트는 범위의 log 다 — 계단으로 오른다</text>
<line x1="108" y1="658" x2="1080" y2="658" stroke="#5b6478" stroke-width="1.4"/>
<line x1="108" y1="658" x2="108" y2="490" stroke="#5b6478" stroke-width="1.4"/>
<text x="594.0" y="682" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="middle" font-weight="400">필요한 범위 (need)</text>
<text x="62" y="572" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="middle" font-weight="400">비트</text>
<line x1="211.68" y1="612" x2="315.36" y2="612" stroke="#1c2333" stroke-width="2.6"/>
<line x1="211.68" y1="612" x2="211.68" y2="648" stroke="#c3cbd9" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="86" y="616" font-family="'SF Mono','Menlo',monospace" font-size="12.5" fill="#1c2333" text-anchor="middle" font-weight="600">7</text>
<text x="315.36" y="674" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="middle" font-weight="400">64</text>
<line x1="315.36" y1="576" x2="522.72" y2="576" stroke="#1c2333" stroke-width="2.6"/>
<line x1="315.36" y1="576" x2="315.36" y2="612" stroke="#c3cbd9" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="86" y="580" font-family="'SF Mono','Menlo',monospace" font-size="12.5" fill="#1c2333" text-anchor="middle" font-weight="600">8</text>
<text x="522.72" y="674" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="middle" font-weight="400">128</text>
<line x1="522.72" y1="540" x2="937.44" y2="540" stroke="#1c2333" stroke-width="2.6"/>
<line x1="522.72" y1="540" x2="522.72" y2="576" stroke="#c3cbd9" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="86" y="544" font-family="'SF Mono','Menlo',monospace" font-size="12.5" fill="#1c2333" text-anchor="middle" font-weight="600">9</text>
<text x="937.44" y="674" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="10.5" fill="#5b6478" text-anchor="middle" font-weight="400">256</text>
<line x1="937.44" y1="504" x2="1080.0" y2="504" stroke="#1c2333" stroke-width="2.6"/>
<line x1="937.44" y1="504" x2="937.44" y2="540" stroke="#c3cbd9" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="86" y="508" font-family="'SF Mono','Menlo',monospace" font-size="12.5" fill="#1c2333" text-anchor="middle" font-weight="600">10</text>
<line x1="367.2" y1="658" x2="367.2" y2="576" stroke="#4a7fd0" stroke-width="1.8" stroke-dasharray="5 3"/>
<circle cx="367.2" cy="576" r="5.5" fill="#4a7fd0"/>
<text x="379.2" y="558" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12" fill="#4a7fd0" text-anchor="start" font-weight="600">실측  need=80  →  8비트</text>
<line x1="525.96" y1="658" x2="525.96" y2="540" stroke="#c9902a" stroke-width="1.8" stroke-dasharray="5 3"/>
<circle cx="525.96" cy="540" r="5.5" fill="#c9902a"/>
<text x="537.96" y="522" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12" fill="#c9902a" text-anchor="start" font-weight="600">경계  need=129  →  9비트</text>
<text x="594.0" y="454" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="12.5" fill="#1c2333" text-anchor="middle" font-weight="600">범위는 80 → 129 로 61% 커지는데, 비트는 8 → 9, 딱 1개 차이다.</text>
<text x="594.0" y="474" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#5b6478" text-anchor="middle" font-weight="400">1비트를 온전히 아끼려면 범위가 절반이 되어야 한다. 37% 줄이는 걸로는 계단 한 칸도 못 내려갈 때가 많다.</text>
<rect x="24" y="714" width="1152" height="154" rx="12" fill="#ffffff" stroke="#c3cbd9" stroke-width="1.2"/>
<text x="44" y="739" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="14.5" fill="#1c2333" text-anchor="start" font-weight="700">D.  그리고 실측에는 guard 비트가 따라붙는다</text>
<rect x="36.0" y="752" width="556.0" height="104" rx="9" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/>
<text x="50.0" y="774" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="13" fill="#1c2333" text-anchor="start" font-weight="700">실측으로 잡으면</text>
<text x="578.0" y="774" font-family="'SF Mono','Menlo',monospace" font-size="14" fill="#1c2333" text-anchor="end" font-weight="700">= 9비트</text>
<text x="50.0" y="796" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#1c2333" text-anchor="start" font-weight="400">· 측정 범위  [-80, 74]</text>
<text x="578.0" y="796" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#5b6478" text-anchor="end" font-weight="400">8비트</text>
<text x="50.0" y="813" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#1c2333" text-anchor="start" font-weight="400">· + guard 1비트  (분포 밖 입력 대비)</text>
<text x="578.0" y="813" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#5b6478" text-anchor="end" font-weight="400">+1</text>
<text x="50.0" y="830" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#1c2333" text-anchor="start" font-weight="400">· + RTL saturate 로직</text>
<text x="578.0" y="830" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#5b6478" text-anchor="end" font-weight="400">필요</text>
<text x="50.0" y="850" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11" fill="#5b6478" text-anchor="start" font-weight="400">본 데이터만큼만 믿을 수 있다</text>
<rect x="608.0" y="752" width="556.0" height="104" rx="9" fill="#e6f4ea" stroke="#3f9a5d" stroke-width="1.4"/>
<text x="622.0" y="774" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="13" fill="#1c2333" text-anchor="start" font-weight="700">경계로 잡으면</text>
<text x="1150.0" y="774" font-family="'SF Mono','Menlo',monospace" font-size="14" fill="#1c2333" text-anchor="end" font-weight="700">= 9비트</text>
<text x="622.0" y="796" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#1c2333" text-anchor="start" font-weight="400">· ±K = ±128  (계산으로 확정)</text>
<text x="1150.0" y="796" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#5b6478" text-anchor="end" font-weight="400">9비트</text>
<text x="622.0" y="813" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#1c2333" text-anchor="start" font-weight="400">· guard 불필요  (원리적으로 못 넘침)</text>
<text x="1150.0" y="813" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#5b6478" text-anchor="end" font-weight="400">+0</text>
<text x="622.0" y="830" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11.5" fill="#1c2333" text-anchor="start" font-weight="400">· saturate 불필요</text>
<text x="1150.0" y="830" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#5b6478" text-anchor="end" font-weight="400">없음</text>
<text x="622.0" y="850" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',sans-serif" font-size="11" fill="#5b6478" text-anchor="start" font-weight="400">어떤 입력에도 안전</text>
</svg>
