<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1120" height="660" fill="#ffffff"/>
<text x="560.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">STFT는 어디에 있나 — 개념(하드웨어) vs 우리 코드</text>
<text x="40" y="70" font-size="16" font-weight="700" fill="#334155">① 실제 하드웨어 (개념)</text>
<text x="40" y="112" font-size="12" font-weight="700" fill="#1e3a8a">경로 A (비교용)</text>
<rect x="150" y="92" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="195.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">오디오</text>
<line x1="240" y1="112" x2="270" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="272" y="92" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="332.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">STFT / FFT</text>
<line x1="392" y1="112" x2="422" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="424" y="92" width="110" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="479.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">mel 64</text>
<line x1="534" y1="112" x2="564" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="566" y="92" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="611.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">신경망</text>
<text x="40" y="182" font-size="12" font-weight="700" fill="#065f46">경로 B (AFE = 진짜 목표)</text>
<rect x="150" y="162" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="195.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">오디오</text>
<line x1="240" y1="182" x2="270" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="272" y="162" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="347.0" y="179.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">아날로그 필터×16</text><text x="347.0" y="195.0" text-anchor="middle" font-size="10" fill="#64748b">물리적 대역분해</text>
<line x1="422" y1="182" x2="452" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="454" y="162" width="110" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="509.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">envelope</text>
<line x1="564" y1="182" x2="594" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="596" y="162" width="100" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="646.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">threshold</text>
<line x1="696" y1="182" x2="726" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="728" y="162" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="773.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">신경망</text>
<rect x="850" y="150" width="230" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="965" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">경로 B엔 STFT/FFT 없음</text>
<text x="965" y="196" text-anchor="middle" font-size="11" fill="#7f1d1d">아날로그 필터가 대신함</text>
<text x="965" y="208" text-anchor="middle" font-size="10" fill="#991b1b">= AFE의 존재 이유(전력↓)</text>
<line x1="40" y1="245" x2="1080" y2="245" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text x="40" y="285" font-size="16" font-weight="700" fill="#334155">② 우리 소프트웨어 시뮬 (실제 코드: data/afe.py)</text>
<text x="40" y="308" font-size="12" fill="#64748b">아날로그 회로가 없으니, 16개 필터를 STFT+mel로 흉내낸다 → 두 경로가 STFT를 공유</text>
<rect x="60" y="360" width="90" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="105.0" y="386.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">오디오</text>
<line x1="150" y1="382" x2="182" y2="382" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="184" y="338" width="120" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="244.0" y="380.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">STFT</text><text x="244.0" y="396.0" text-anchor="middle" font-size="10" fill="#64748b">(공통 프리즘)</text>
<text x="244" y="446" text-anchor="middle" font-size="10" fill="#2563eb">stft_win/hop/n_fft</text>
<line x1="304" y1="360" x2="336" y2="352" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="338" y="332" width="110" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="393.0" y="349.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">mel 64</text><text x="393.0" y="365.0" text-anchor="middle" font-size="10" fill="#64748b">경로 A</text>
<line x1="448" y1="352" x2="478" y2="352" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="480" y="332" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="525.0" y="356.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">연속 → NN</text>
<line x1="304" y1="404" x2="336" y2="414" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="338" y="414" width="110" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="393.0" y="431.0" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">mel 16</text><text x="393.0" y="447.0" text-anchor="middle" font-size="10" fill="#64748b">경로 B(AFE)</text>
<line x1="448" y1="434" x2="470" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="472" y="414" width="96" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="520.0" y="438.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">envelope</text>
<line x1="568" y1="434" x2="588" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="590" y="414" width="86" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="633.0" y="438.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">threshold</text>
<line x1="676" y1="434" x2="696" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="698" y="414" width="54" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="725.0" y="438.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">±1</text>
<line x1="752" y1="434" x2="772" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="774" y="414" width="80" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="814.0" y="438.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">NN</text>
<rect x="880" y="332" width="210" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="985" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">핵심</text>
<text x="895" y="380" font-size="11.5" fill="#0c4a6e">· STFT는 <tspan font-weight="700">두 경로 공통</tspan>.</text>
<text x="895" y="400" font-size="11.5" fill="#0c4a6e">· AFE(경로B)도 코드에선</text>
<text x="905" y="416" font-size="11.5" fill="#0c4a6e">STFT를 씀(필터 흉내).</text>
<text x="895" y="438" font-size="11.5" fill="#0c4a6e">· 진짜 차이 = 필터 수:</text>
<text x="905" y="454" font-size="11.5" fill="#0c4a6e">n_mels 64 vs n_channels 16</text>
<text x="895" y="474" font-size="10.5" fill="#b91c1c">→ "stft=경로A 전용" 주석은 틀림</text>
<line x1="40" y1="515" x2="1080" y2="515" stroke="#e2e8f0"/>
<text x="40" y="545" font-size="12.5" fill="#334155"><tspan font-weight="700">정리:</tspan> 하드웨어 관점엔 "경로 B=STFT 없음"이 맞지만, <tspan font-weight="700">우리 소프트웨어 시뮬은 STFT로 아날로그 필터를 흉내</tspan>내므로 경로 B도 STFT를 쓴다.</text>
<text x="40" y="568" font-size="12.5" fill="#334155">그래서 config 주석은 "STFT=공통 프론트엔드, n_mels=경로A(64) / n_channels=경로B(16)"로 다는 게 정확하다. (A-1 권장)</text>
</svg>