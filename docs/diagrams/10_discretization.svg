<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="1040" height="600" fill="#ffffff"/>
<text x="520.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">이산화 규칙 — 연속 이벤트를 [16, T] 이진 칸으로</text>
<text x="520.0" y="58" text-anchor="middle" font-size="13" fill="#64748b">한 채널의 20 ms 예시.  규칙(max) = "이 칸에 펄스가 한 번이라도 있으면 1"</text>
<rect x="100" y="95" width="400" height="150" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<rect x="500" y="95" width="400" height="150" rx="6" fill="#fef9f3" stroke="#fdba74" stroke-width="1.4"/>
<text x="300" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">칸 0: 0–10 ms</text>
<text x="700" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">칸 1: 10–20 ms</text>
<line x1="100" y1="220" x2="900" y2="220" stroke="#334155" stroke-width="1.5"/>
<line x1="100" y1="216" x2="100" y2="224" stroke="#334155" stroke-width="1"/>
<text x="100" y="240" text-anchor="middle" font-size="10" fill="#64748b">0</text>
<line x1="180" y1="216" x2="180" y2="224" stroke="#334155" stroke-width="1"/>
<text x="180" y="240" text-anchor="middle" font-size="10" fill="#64748b">2</text>
<line x1="260" y1="216" x2="260" y2="224" stroke="#334155" stroke-width="1"/>
<text x="260" y="240" text-anchor="middle" font-size="10" fill="#64748b">4</text>
<line x1="340" y1="216" x2="340" y2="224" stroke="#334155" stroke-width="1"/>
<text x="340" y="240" text-anchor="middle" font-size="10" fill="#64748b">6</text>
<line x1="420" y1="216" x2="420" y2="224" stroke="#334155" stroke-width="1"/>
<text x="420" y="240" text-anchor="middle" font-size="10" fill="#64748b">8</text>
<line x1="500" y1="216" x2="500" y2="224" stroke="#334155" stroke-width="1"/>
<text x="500" y="240" text-anchor="middle" font-size="10" fill="#64748b">10</text>
<line x1="580" y1="216" x2="580" y2="224" stroke="#334155" stroke-width="1"/>
<text x="580" y="240" text-anchor="middle" font-size="10" fill="#64748b">12</text>
<line x1="660" y1="216" x2="660" y2="224" stroke="#334155" stroke-width="1"/>
<text x="660" y="240" text-anchor="middle" font-size="10" fill="#64748b">14</text>
<line x1="740" y1="216" x2="740" y2="224" stroke="#334155" stroke-width="1"/>
<text x="740" y="240" text-anchor="middle" font-size="10" fill="#64748b">16</text>
<line x1="820" y1="216" x2="820" y2="224" stroke="#334155" stroke-width="1"/>
<text x="820" y="240" text-anchor="middle" font-size="10" fill="#64748b">18</text>
<line x1="900" y1="216" x2="900" y2="224" stroke="#334155" stroke-width="1"/>
<text x="900" y="240" text-anchor="middle" font-size="10" fill="#64748b">20</text>
<text x="918" y="224" font-size="11" fill="#64748b">ms</text>
<line x1="148.0" y1="220" x2="148.0" y2="140" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="143.0,140 153.0,140 148.0,128" fill="#dc2626"/>
<text x="148.0" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">1.2</text>
<line x1="284.0" y1="220" x2="284.0" y2="140" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="279.0,140 289.0,140 284.0,128" fill="#dc2626"/>
<text x="284.0" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">4.6</text>
<line x1="636.0" y1="220" x2="636.0" y2="140" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="631.0,140 641.0,140 636.0,128" fill="#dc2626"/>
<text x="636.0" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">13.4</text>
<line x1="824.0" y1="220" x2="824.0" y2="140" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="819.0,140 829.0,140 824.0,128" fill="#dc2626"/>
<text x="824.0" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">18.1</text>
<text x="300" y="272" text-anchor="middle" font-size="12" fill="#334155">펄스 2개 (1.2, 4.6)</text>
<text x="700" y="272" text-anchor="middle" font-size="12" fill="#334155">펄스 2개 (13.4, 18.1)</text>
<text x="300" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">max → 1</text>
<text x="700" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">max → 1</text>
<text x="520.0" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">결과 (이 채널의 두 칸):</text>
<rect x="270" y="342" width="60" height="46" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="300" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">1</text>
<rect x="670" y="342" width="60" height="46" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="700" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">1</text>
<rect x="600" y="300" width="410" height="98" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="620" y="324" font-size="13" font-weight="700" fill="#b91c1c">정보 손실이 의도된 동작</text>
<text x="620" y="346" font-size="11.5" fill="#7f1d1d">· 칸에 펄스가 2개든 1개든 결과는 똑같이 <tspan font-weight="700">1</tspan>.</text>
<text x="620" y="366" font-size="11.5" fill="#7f1d1d">· 펄스 개수·발생시각·지속시간이 전부 소실.</text>
<text x="620" y="386" font-size="11.5" fill="#7f1d1d">· 남는 건 "이 대역에 에너지 있었나" 1비트.</text>
<line x1="40" y1="420" x2="1000" y2="420" stroke="#e2e8f0"/>
<text x="40" y="448" font-size="15" font-weight="700" fill="#334155">우리 코드에선?</text>
<text x="40" y="472" font-size="12.5" fill="#334155">우리 시뮬은 <tspan font-weight="700">STFT 10 ms hop</tspan>이라 서브-ms 펄스(1.2 vs 4.6 ms)를 <tspan font-weight="700">구분 못 함</tspan> — 이미 10 ms로 뭉개짐.</text>
<text x="40" y="494" font-size="12.5" fill="#334155">그래서 위 "펄스열 → [1,1]" 테스트를 전체 파이프라인에 그대로 못 넣는다.</text>
<rect x="40" y="508" width="960" height="66" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
<text x="56" y="530" font-size="12.5" font-weight="700" fill="#065f46">해결: 이산화 규칙만 작은 함수로 떼서 테스트</text>
<text x="56" y="550" font-size="11.5" fill="#065f46">discretize(events, window_ms, reduce="max") 를 만들고, 위 표(1.2/4.6/13.4/18.1)를 직접 넣어 [1,1] 확인.</text>
<text x="56" y="568" font-size="11" fill="#059669">우리 max-pool은 "threshold 후 OR"과 수학적으로 동일하므로, 이 로직 테스트로 baseline 의미가 커버됨.</text>
</svg>