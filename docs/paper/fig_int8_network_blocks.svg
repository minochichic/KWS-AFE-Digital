<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>세 모델의 층별 연산 종류</title><desc>bd_base, conv2만 INT8, 전부 INT8(W8A8) 세 모델을 층별로 쌓아, 각 층이 XNOR, INT8×±1 덧셈, INT8 곱셈 중 무엇으로 계산되는지와 활성이 1비트에서 다비트로 바뀌는 지점을 보인다.</desc><style>
text{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple text{fill:#3C3489}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal text{fill:#085041}
.c-coral rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral text{fill:#712B13}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text{fill:#444441}
</style><rect width="680" height="500" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="115" y="22" text-anchor="middle" dominant-baseline="central">bd_base (이진)</text>
<text class="ts" x="115" y="41" text-anchor="middle" dominant-baseline="central">82.5% · 57 μJ · DSP 0</text>
<text class="th" x="340" y="22" text-anchor="middle" dominant-baseline="central">Conv2 → INT8</text>
<text class="ts" x="340" y="41" text-anchor="middle" dominant-baseline="central">82.8% · 73 μJ · DSP 1</text>
<text class="th" x="565" y="22" text-anchor="middle" dominant-baseline="central">All INT8 (W8A8)</text>
<text class="ts" x="565" y="41" text-anchor="middle" dominant-baseline="central">86.7% · 147 μJ · DSP 30</text>

<g class="c-gray"><rect x="30" y="62" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="115" y="79" text-anchor="middle" dominant-baseline="central">AFE → ±1 프레임</text></g>
