<g class="c-coral"><rect x="255" y="272" width="170" height="34" rx="4" stroke-width="2"/><text class="th" x="340" y="289" text-anchor="middle" dominant-baseline="central">conv2 dw · ADD</text></g>
<g class="c-teal"><rect x="480" y="272" width="170" height="34" rx="4" stroke-width="2"/><text class="th" x="565" y="289" text-anchor="middle" dominant-baseline="central">conv2 dw · MAC 8×8</text></g>

<g class="c-purple"><rect x="30" y="314" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="115" y="331" text-anchor="middle" dominant-baseline="central">conv2 pw · XNOR</text></g>
<g class="c-teal"><rect x="255" y="314" width="170" height="34" rx="4" stroke-width="2"/><text class="th" x="340" y="331" text-anchor="middle" dominant-baseline="central">conv2 pw · MAC</text></g>
