<g class="c-gray"><rect x="480" y="62" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="565" y="79" text-anchor="middle" dominant-baseline="central">AFE → ±1 프레임</text></g>

<g class="c-coral"><rect x="30" y="104" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="115" y="121" text-anchor="middle" dominant-baseline="central">conv1 · ADD → sign</text></g>
<g class="c-coral"><rect x="255" y="104" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="340" y="121" text-anchor="middle" dominant-baseline="central">conv1 · ADD → sign</text></g>
<g class="c-coral"><rect x="480" y="104" width="170" height="34" rx="4" stroke-width="2"/><text class="th" x="565" y="121" text-anchor="middle" dominant-baseline="central">conv1 · ADD → ReLU</text></g>

<g class="c-purple"><rect x="30" y="146" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="115" y="163" text-anchor="middle" dominant-baseline="central">B1 · XNOR</text></g>
