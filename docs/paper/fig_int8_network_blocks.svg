<g class="c-teal"><rect x="255" y="356" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="340" y="373" text-anchor="middle" dominant-baseline="central">conv3 · MAC</text></g>
<g class="c-teal"><rect x="480" y="356" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="565" y="373" text-anchor="middle" dominant-baseline="central">conv3 · MAC</text></g>

<g class="c-teal"><rect x="30" y="398" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="115" y="415" text-anchor="middle" dominant-baseline="central">conv4 · MAC → pool</text></g>
<g class="c-teal"><rect x="255" y="398" width="170" height="34" rx="4" stroke-width="0.5"/><text class="th" x="340" y="415" text-anchor="middle" dominant-baseline="central">conv4 · MAC → pool</text></g>
