# BinaryMatchboxNet-3x2xC -- baseline config.
# Every size in the model comes from here. Do not hardcode C/T/kernels in code.
#
# Sources for the numbers below:
#   MatchboxNet.pdf Table 1 + 4.1   -> stage kernels, channel multipliers, STFT
#   Cerutti IV-A / IV-C / VI-A      -> AFE envelope, thresholds, Adam 1e-4
#   CLAUDE.md 2.2                   -> per-stage precision assignment

tag: base

# AFE (analog front-end simulation). Full per-variable reference: docs/afe_config.md
afe:
  # --- input definition ---
  n_channels: 16       # AFE output channels = Mel filter count = model input rows.
                       #   Sets the hardware filterbank size. THE key sweep axis.
  sample_rate: 16000   # audio sample rate (Hz). 1 s clip = 16000 samples.
  clip_ms: 1000.0      # clip length (ms). shorter -> zero-pad, longer -> crop.

  # --- STFT ---
  stft_win_ms: 25.0    # STFT window length (ms); 25 ms = 400 samples.
  stft_hop_ms: 10.0    # window step (ms); 10 ms = 160 samples -> ~100 frames/s.
  n_fft: 512           # FFT size (freq resolution); must be >= win_length.

  # --- Mel filterbank ---
  n_mels: 64           # NOT USED by the AFE path. The AFE builds its own bank of
                       #   n_channels(16) filters (data/afe.py sets MelSpectrogram
                       #   n_mels=n_channels). This 64 is a placeholder for a future
                       #   full-precision Mel baseline (Cerutti VI-A) and is ignored
                       #   until that is implemented. Do not confuse with n_channels.
  f_min: 50.0          # filterbank lowest corner freq (Hz).
  f_max: 8000.0        # filterbank highest corner freq (Hz); must be <= Nyquist
                       #   (sample_rate/2 = 8000). Cerutti Fig.6: 50 Hz - 8 kHz was
                       #   the best 8-filter range. NOTE: the sc_v2 baseline run
                       #   (test 0.809) used 7500; raised to 8000 to match Cerutti.

  # --- envelope: sets the output time length T ---
  # native_T = clip_ms / envelope_win_ms = 1000/10 = 100, zero-padded to T=128
  # exactly as MatchboxNet 4.1. Do NOT use 25 ms (native_T=40): after conv1's
  # stride 2 that leaves 20 frames, shorter than conv2's kernel span of 57, so
  # conv2 convolves over padding and the model collapses (see docs/diagrams/
  # 08_dilation_span.svg and Config.time_axis_report()).
  envelope_win_ms: 10.0
  envelope_reduce: max   # summarize each window by its max (Cerutti IV-A); or mean.

  # --- binarization (comparator + learnable threshold) ---
  normalize: minmax         # scale envelopes to [0,1] per clip, GLOBAL across
                            #   channels (not per-channel) so inter-channel level
                            #   differences survive for the thresholds to absorb.
  threshold_init: channel_mean  # init the 16 thresholds to per-channel mean
                                #   envelope (Cerutti IV-A); see init_thresholds().
  threshold_trainable: true # learn the thresholds end-to-end with the net (2.4).
  ste: hardtanh             # straight-through estimator for the step comparison
                            #   (sign has zero gradient; STE lets it train).
  ste_clip: 1.0             # STE gradient passes where |env - thr| <= ste_clip.
                            #   Envelopes are in [0,1], so every element is inside.

model:
  C: 64
  T: 128               # MatchboxNet 4.1 pads to 128 frames
  n_classes: 12
  in_channels: 16

  weight_ste: hardtanh
  weight_ste_clip: 1.0
  scale_binary_weights: true

  bn_momentum: 0.1
  bn_eps: 1.0e-5
  final_pool: avg

  # MatchboxNet Table 1 topology, with CLAUDE.md 2.2 precision overlay.
  stages:
    - name: conv1          # prologue: NEVER binary (input is already binary)
      kernel: 11
      stride: 2
      precision: int8
      channels_mult: 2.0   # 128 when C=64
      separable: false

    - name: b1
      kernel: 13
      precision: binary
      channels_mult: 1.0
      n_sub_blocks: 2
      separable: true
      residual: true
      dropout: 0.0

    - name: b2
      kernel: 15
      precision: binary
      channels_mult: 1.0
      n_sub_blocks: 2
      separable: true
      residual: true
      dropout: 0.0

    - name: b3
      kernel: 17
      precision: binary
      channels_mult: 1.0
      n_sub_blocks: 2
      separable: true
      residual: true
      dropout: 0.0

    - name: conv2          # ablation knobs: precision binary <-> int8,
      kernel: 29           #                 separable <-> dense
      dilation: 2
      precision: binary
      channels_mult: 2.0
      # DECISION (2026-07-21, user-approved): separable by default. A dense
      # k=29 conv here alone is 238K params -- more than the whole 93K
      # MatchboxNet-3x2x64 -- so the original paper's epilogue must have been
      # separable. separable brings the total to ~96.5K, matching the paper.
      # IF ACCURACY FALLS SHORT of the 85% target, flipping this back to
      # `separable: false` (dense, 324K total) is a known candidate fix.
      separable: true

    - name: conv3
      kernel: 1
      precision: int8
      channels_mult: 2.0

    - name: conv4          # epilogue: NEVER binary
      kernel: 1
      precision: fixed
      channels_abs: 12

data:
  name: speech_commands_v2
  root: datasets/speech_commands_v2
  version: v0.02
  # QUOTE these: unquoted yes/no/on/off parse as YAML booleans (the "Norway
  # problem"), corrupting the list to [true, false, ...]. The data pipeline
  # actually labels via the KEYWORDS constant in data/speech_commands.py, so
  # this field was cosmetic, but a corrupted config is a footgun.
  keywords: ["yes", "no", "up", "down", "left", "right", "on", "off", "stop", "go"]
  split: official
  silence_fraction: 0.1
  unknown_fraction: 0.1
  num_workers: 2
  cache_features: true
  # Augmentation off for the first reproducible run (CLAUDE.md 3).
  aug_time_shift_ms: 0.0
  aug_specaug_time_masks: 0
  aug_specaug_freq_masks: 0
  aug_noise_prob: 0.0

train:
  epochs: 100
  batch_size: 128
  optimizer: adam       # NovoGrad only after Adam reproduces (CLAUDE.md 3)
  lr: 1.0e-3
  min_lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  scheduler: plateau
  label_smoothing: 0.0
  grad_clip: 0.0
  amp: true
  seed: 1234
  log_every: 50
  out_dir: runs
  device: auto
