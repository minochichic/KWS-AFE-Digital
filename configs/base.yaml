# BinaryMatchboxNet-3x2xC -- baseline config.
# Every size in the model comes from here. Do not hardcode C/T/kernels in code.
#
# Sources for the numbers below:
#   MatchboxNet.pdf Table 1 + 4.1   -> stage kernels, channel multipliers, STFT
#   Cerutti IV-A / IV-C / VI-A      -> AFE envelope, thresholds, Adam 1e-4
#   CLAUDE.md 2.2                   -> per-stage precision assignment

tag: base

# AFE (analog front-end simulation). Full per-variable reference: docs/afe_config.md
afe:
  # --- input definition ---
  n_channels: 16       # AFE output channels = Mel filter count = model input rows.
                       #   Sets the hardware filterbank size. THE key sweep axis.
  sample_rate: 16000   # audio sample rate (Hz). 1 s clip = 16000 samples.
  clip_ms: 1000.0      # clip length (ms). shorter -> zero-pad, longer -> crop.

  # --- STFT front-end (SHARED by both paths in our software sim) ---
  # CLAUDE.md 2.9/2.10: the real AFE has no STFT (analog filters split freq),
  # but our sim fakes the analog filterbank with STFT+mel, so these are used by
  # BOTH the baseline (path A, n_mels) AND the AFE path (path B, n_channels).
  # NOT "path A only". stft_hop_ms and envelope_win_ms are independent.
  stft_win_ms: 25.0    # STFT window length (ms); 25 ms = 400 samples.
  stft_hop_ms: 10.0    # window step (ms); 10 ms = 160 samples -> ~100 frames/s.
  n_fft: 512           # FFT size (freq resolution); must be >= win_length.

  # --- Mel filterbank ---
  n_mels: 64           # NOT USED by the AFE path (path B). It is the mel filter
                       #   count for the full-precision baseline (path A, Cerutti
                       #   VI-A), which is not implemented yet. The AFE builds its
                       #   own bank of n_channels(16) filters (data/afe.py sets
                       #   MelSpectrogram n_mels=n_channels). Don't confuse the two.
  f_min: 50.0          # filterbank lowest corner freq (Hz).
  f_max: 8000.0        # filterbank highest corner freq (Hz); must be <= Nyquist
                       #   (sample_rate/2 = 8000). Cerutti Fig.6: 50 Hz - 8 kHz was
                       #   the best 8-filter range. NOTE: the sc_v2 baseline run
                       #   (test 0.809) used 7500; raised to 8000 to match Cerutti.

  # --- envelope: AFE path (B) only. sets the output time length T ---
  # native_T = clip_ms / envelope_win_ms = 1000/10 = 100, zero-padded to T=128
  # exactly as MatchboxNet 4.1. CLAUDE.md 3.1: with the current conv2 (k=29,
  # dilation=2, span 57), only T=128 (->64 frames after conv1) is valid; smaller
  # T (25 ms/T=40, or 10 ms cropped to 96/64) leaves <57 frames and conv2
  # convolves over padding -> collapse. See 08_dilation_span.svg and
  # Config.time_axis_report(). Independent of stft_hop_ms.
  envelope_win_ms: 10.0
  envelope_reduce: max   # window summary. max = "any pulse in window -> 1"
                         #   (Cerutti IV-A). max-then-threshold == threshold-then-OR.
                         #   Alternatives count/mean break binary-ness (CLAUDE.md 2.8).

  # --- envelope smoothing (active-detector C3 모사) ---
  # CLAUDE.md 3.2: baseline is OFF (0.0). tau has NO paper value -- it is a
  # design DOF / ablation axis, not a reproduction parameter. 0.0 must make the
  # smoothing step an exact identity (no-op). >0 applies EMA over STFT frames
  # (a software approximation of the analog C3 sawtooth), before discretization.
  envelope_tau_ms: 0.0

  # --- binarization (comparator + learnable threshold) ---
  # ---- 확정 프론트엔드 --------------------------------------------------------
  #
  # 결정 기록 (2026-08-26, 사용자 승인): **트랙 2 (`fixed`, 절대 임계)** 로 간다.
  #   "학습된 임계값을 이용해 저항비를 고정하여 PCB 를 만든다."
  #
  # 트랙 1(`xlse`, 다이오드-OR)이 정확도는 더 높다 (0.8445 vs 0.817). 하지만
  # xlse 의 임계값은 채널 고유값이 아니라 **16채널 공통 노드 기준의 분압**이라
  # 다이오드-OR 회로가 실제로 만들어져야 성립한다. 그게 불확실해서 트랙 2 가
  # 주력이 됐다. 트랙 2 는 lo/hi 가 데이터셋 상수이므로 `env >= thr` 이 그대로
  # 절대 임계이고, **채널마다 R7/R8 분압 하나**로 떨어진다.
  # 근거: docs/ABLATIONS.md 트랙 2 표, data/afe.py init_fixed_scale().
  #       트랙 1 은 docs/EXPERIMENT_MAP.md A-1 에 그대로 보존.
  #
  filterbank_source: spice  # 실제 GIC 응답 (mel 삼각형이 아니라)
  # ⚠️ 미결: 밴드. 지금은 config.py 기본값 filterbank_matrix.csv (50-8000) 를 쓴다.
  #    ⚠️ 아래 f_min/f_max 로는 못 바꾼다 -- spice 경로에서 그 둘은 안 읽힌다.
  #    밴드는 행렬 CSV 안에 있으므로 spice_matrix_path 를 바꿔야 한다.
  #    2026-08-26 현재 50-8000 에는 **쓸 수 있는 부품이 없다**: 최상단 ch15(6761 Hz)
  #    가 OPA379 로 1.16 mV 라 비교기 3 mV 문턱 아래로 붕괴하고, 대안이던
  #    TLV9041D 는 비보상(gain>=10 V/V)이라 우리 검출기 4.7 V/V 에서 못 쓴다.
  #    125-5000 은 OPA379 단독으로 16/16 통과하고 정확도 대가는 -0.3pp(잡음)다.
  #    확정하면: spice_matrix_path: analog/AFE/artifacts/filterbank_matrix_125_5000.csv
  #    근거: analog/AFE_tuning/artifacts/{opamp_gain_per_channel,r7r8_opa379_125_5000}.md
  compression: sqrt         # 검출기가 진폭에 선형 -> sqrt 가 회로에 충실
  normalize: fixed          # 데이터셋 전역 min-max -> 절대 임계 = 고정 R7/R8.
                            # ⚠️ `minmax` 는 이것과 다른 것이다: 클립마다 스케일을
                            # 다시 잡는 AGC 라 볼륨을 2배로 해도 비트가 하나도 안
                            # 바뀐다. 저항으로 만들 수 없다.
                            # 가드: tests/test_afe.py
                            #       test_minmax_is_gain_invariant_and_fixed_is_not
  fixed_scale_quantile: 0.75  # ⚠️ 기본값 1.0 을 쓰면 안 된다. 1.0 은 전역 max =
                            # 이상치 클립 하나라 전형적 클립이 [0,1] 의 얇은 조각으로
                            # 눌리고, threshold 가 0.002~0.010 에 앉아 Adam 한 스텝이
                            # 15% 씩 움직인다. 실제로 fx_g12 가 0.5763 + 죽은 비교기
                            # 4개로 끝났다. q 스윕: 1.0 -> 0.693 / **0.75 -> 0.726** /
                            # 0.6 -> 0.653 (증강 없는 조건).
  # 아래 둘은 normalize=xlse 전용이라 지금은 **읽히지 않는다.** 트랙 1 로 되돌릴
  # 때를 위해 값과 근거를 남겨둔다.
  lse_temp_frac: 0.78       # = n*V_T / 요구 스윙. 즉 26mV/0.78 = 33 mV 를 요구한다.
                            # 평탄대는 13~50 mV -- 한 점이 아니다(EXPERIMENTS.md 8).
  xmax_floor_frac: 0.0      # -> delta = 0. 측정으로 확정 (EXPERIMENT_MAP A-3):
                            # (a) LSE >= T*ln(16) = 1.617 이라는 자체 바닥이 있어
                            #     무음이 0.0006 로 알아서 꺼진다 (하드 max 는 1.0),
                            # (b) floor_frac 0~0.10 에서 alpha 가 거의 안 움직이고
                            #     죽는 채널도 0/16 (xmix 의 "0.05 는 4채널 사망" 은
                            #     하드 max 성질이라 여기 적용 안 됨),
                            # (c) 그 구간 전체에서 delta 가 0.04~0.80 mV 로 실제
                            #     comparator offset(~1 mV) 아래다 -- 하드웨어가
                            #     어떤 값을 골라도 0 과 구별하지 못한다.
                            # => V_ref 를 detector 정지점(917.8 mV)에 둔다.
  threshold_init: channel_mean  # init the 16 thresholds to per-channel mean
                                #   envelope (Cerutti IV-A); see init_thresholds().
  threshold_trainable: true # learn the thresholds end-to-end with the net (2.4).
  ste: hardtanh             # straight-through estimator for the step comparison
                            #   (sign has zero gradient; STE lets it train).
  ste_clip: 0.003           # STE gradient passes where |env - thr| <= ste_clip.
                            #   1.0 은 엔벨로프가 [0,1] 이라 전부 통과 = 사실상 무제한
                            #   이었고, 그 아래서 임계값은 무음 프레임 다수결에 끌려
                            #   85~89 분위까지 올라갔다. 좁히면 경계 근처만 표를
                            #   던져서 54~87 분위로 내려온다.
                            #   측정: 1.0 -> 0.7169 / 0.1 -> 0.767 / 0.03 -> 0.800 /
                            #   0.01 -> 0.811 / **0.003 -> 0.817** (트랙 2 최고).
                            #   docs/ABLATIONS.md 트랙 2 표.

model:
  C: 64
  T: 128               # MatchboxNet 4.1 pads to 128 frames
  n_classes: 12
  in_channels: 16

  weight_ste: hardtanh
  weight_ste_clip: 1.0
  scale_binary_weights: true

  bn_momentum: 0.1
  bn_eps: 1.0e-5
  final_pool: avg

  # MatchboxNet Table 1 topology, with CLAUDE.md 2.2 precision overlay.
  stages:
    - name: conv1          # prologue: NEVER binary (input is already binary)
      kernel: 11
      stride: 2
      precision: int8
      channels_mult: 2.0   # 128 when C=64
      separable: false

    - name: b1
      kernel: 13
      precision: binary
      channels_mult: 1.0
      n_sub_blocks: 2
      separable: true
      residual: true
      dropout: 0.0

    - name: b2
      kernel: 15
      precision: binary
      channels_mult: 1.0
      n_sub_blocks: 2
      separable: true
      residual: true
      dropout: 0.0

    - name: b3
      kernel: 17
      precision: binary
      channels_mult: 1.0
      n_sub_blocks: 2
      separable: true
      residual: true
      dropout: 0.0

    - name: conv2          # ablation knobs: precision binary <-> int8,
      kernel: 29           #                 separable <-> dense
      dilation: 2
      precision: binary
      channels_mult: 2.0
      # DECISION (2026-07-21, user-approved): separable by default. A dense
      # k=29 conv here alone is 238K params -- more than the whole 93K
      # MatchboxNet-3x2x64 -- so the original paper's epilogue must have been
      # separable. separable brings the total to ~96.5K, matching the paper.
      # IF ACCURACY FALLS SHORT of the 85% target, flipping this back to
      # `separable: false` (dense, 324K total) is a known candidate fix.
      separable: true

    - name: conv3
      kernel: 1
      precision: int8
      channels_mult: 2.0

    - name: conv4          # epilogue: NEVER binary
      kernel: 1
      precision: fixed
      channels_abs: 12

data:
  name: speech_commands_v2
  root: datasets/speech_commands_v2
  version: v0.02
  # QUOTE these: unquoted yes/no/on/off parse as YAML booleans (the "Norway
  # problem"), corrupting the list to [true, false, ...]. The data pipeline
  # actually labels via the KEYWORDS constant in data/speech_commands.py, so
  # this field was cosmetic, but a corrupted config is a footgun.
  keywords: ["yes", "no", "up", "down", "left", "right", "on", "off", "stop", "go"]
  split: official
  silence_fraction: 0.1
  unknown_fraction: 0.1
  num_workers: 2
  cache_features: true
  # Augmentation off for the first reproducible run (CLAUDE.md 3).
  # Waveform augmentation (train split only). OFF here so base = no-aug
  # baseline. Turn on via override, e.g. data.aug_time_shift_ms=5
  # data.aug_noise_prob=0.3. SNR range applies when noise fires.
  aug_time_shift_ms: 0.0
  aug_noise_prob: 0.0
  aug_noise_snr_db: [5.0, 30.0]
  aug_specaug_time_masks: 0     # SpecAugment deferred
  aug_specaug_freq_masks: 0

train:
  epochs: 100
  batch_size: 128
  optimizer: adam       # NovoGrad only after Adam reproduces (CLAUDE.md 3)
  lr: 1.0e-3
  min_lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  scheduler: plateau
  label_smoothing: 0.0
  grad_clip: 0.0
  amp: true
  seed: 1234
  log_every: 50
  out_dir: runs
  device: auto
