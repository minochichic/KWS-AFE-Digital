<text x="307" y="465" text-anchor="middle" font-size="11" fill="#dc2626">→ floor가 가드 위에 정확히 착지</text>
<text x="123" y="492" text-anchor="start" font-size="10.5" fill="#0f172a">무음 프레임은 16채널이 전부 1e-3으로 같다</text>
<text x="123" y="507" text-anchor="start" font-size="10.5" fill="#0f172a">xmax = 1e-3 / 1e-3 = 1.0   (전 채널)</text>
<text x="123" y="522" text-anchor="start" font-size="10.5" fill="#dc2626" font-weight="700">무신호가 '가장 활발한 이미지'가 된다</text>
<text x="123" y="552" text-anchor="start" font-size="10.5" fill="#0f172a">실측: 제로 클립 발화율 100%,</text>
<text x="123" y="567" text-anchor="start" font-size="10.5" fill="#0f172a">×0.01 조용한 클립이 음성보다 더 발화</text>
<text x="123" y="582" text-anchor="start" font-size="10.5" fill="#0f172a">(0.538 &gt; 0.386) — 하드웨어는 이럴 수 없다</text>
