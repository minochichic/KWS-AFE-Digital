<text x="747" y="578" text-anchor="middle" font-size="10.5" fill="#64748b">무음은 막고 음성 발화율은 거의 그대로 (0.366 vs 0.386)</text>
<text x="105" y="646" text-anchor="start" font-size="10.5" fill="#64748b">floor는 분포의 분위수로 정해진다 — 데이터셋 최댓값의 비율로 잡으면 87%의 프레임을 지배해 fixed로 퇴화한다.</text>
