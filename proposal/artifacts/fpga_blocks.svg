<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="1300" height="900" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#334155"/></marker></defs>
<text x="650.0" y="34" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="700">FPGA 블록 구성 — AMD Kintex-7 KC705</text>
<text x="650.0" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">접은(folded) 가속기 + 자유 구동 슬라이딩 창. 완전 펼침은 불필요하고 애초에 들어가지도 않는다.</text>
<rect x="40" y="96" width="150" height="108" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="115" y="118" text-anchor="middle" font-size="12.5" fill="#64748b" font-weight="700">아날로그 AFE</text>
<text x="115" y="137" text-anchor="middle" font-size="10" fill="#64748b">(FPGA 밖)</text>
<text x="115" y="160" text-anchor="middle" font-size="11.5" fill="#9a3412" font-weight="700">비교기 16개</text>
<text x="115" y="177" text-anchor="middle" font-size="10" fill="#64748b">0/1 라인 ×16</text>
<text x="115" y="194" text-anchor="middle" font-size="9" fill="#64748b">→ proposal/THRESHOLD.md</text>
<line x1="190" y1="150" x2="232" y2="150" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="232" y="80" width="1028" height="560" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="250" y="102" text-anchor="start" font-size="13" fill="#0f172a" font-weight="700">XC7K325T</text>
<text x="322" y="102" text-anchor="start" font-size="10.5" fill="#64748b">— 아래 설계는 LUT 1.3% / BRAM 3.3%만 쓴다</text>
<rect x="256" y="122" width="300" height="250" rx="6" fill="#fef9f3" stroke="#fdba74" stroke-width="1.4"/>
<text x="406" y="146" text-anchor="middle" font-size="13.5" fill="#9a3412" font-weight="700">A. 프레임 조립</text>
<text x="406" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">AFE 비트열 → [16, 128] 이미지</text>
<rect x="274" y="178" width="264" height="44" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
<text x="406" y="197" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="700">동기화 2FF ×16</text>
<text x="406" y="212" text-anchor="middle" font-size="9.5" fill="#64748b">비동기 입력 → 클럭 도메인</text>
<line x1="406" y1="222" x2="406" y2="232" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="274" y="232" width="264" height="44" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
<text x="406" y="251" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="700">10 ms OR 누산</text>
<text x="406" y="266" text-anchor="middle" font-size="9.5" fill="#64748b">창 안에 한 번이라도 1이면 1</text>
<line x1="406" y1="276" x2="406" y2="286" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="274" y="286" width="264" height="44" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
<text x="406" y="305" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="700">시프트 레지스터</text>
<text x="406" y="320" text-anchor="middle" font-size="9.5" fill="#64748b">16비트 × 100단 = 1600 FF</text>
<text x="406" y="348" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="700">패딩 28칸은 저장 안 한다 — 항상 −1인 상수</text>
<text x="406" y="363" text-anchor="middle" font-size="9.5" fill="#64748b">주소 &lt;14 또는 ≥114 이면 −1 반환</text>
<rect x="576" y="122" width="330" height="250" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="741" y="146" text-anchor="middle" font-size="13.5" fill="#1e3a8a" font-weight="700">B. 접은 가속기</text>
<text x="741" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">6.0 M MAC / 추론</text>
<rect x="592" y="180" width="298" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="741" y="197" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="700">XNOR-popcount PE</text>
<text x="741" y="211" text-anchor="middle" font-size="9.5" fill="#64748b">이진 3.42 M MAC (57%)</text>
<text x="741" y="224" text-anchor="middle" font-size="9.5" fill="#1e3a8a">P=64 → 53.5 k cyc</text>
<rect x="592" y="238" width="298" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="741" y="255" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="700">부호 누산기</text>
<text x="741" y="269" text-anchor="middle" font-size="9.5" fill="#64748b">conv1 1.44 M — 곱셈기 없음</text>
<text x="741" y="282" text-anchor="middle" font-size="9.5" fill="#1e3a8a">입력이 ±1이라</text>
<rect x="592" y="296" width="298" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="741" y="313" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="700">DSP48 MAC</text>
<text x="741" y="327" text-anchor="middle" font-size="9.5" fill="#64748b">conv3·conv4 1.15 M (int8)</text>
<text x="741" y="340" text-anchor="middle" font-size="9.5" fill="#1e3a8a">진짜 곱셈은 여기뿐</text>
<text x="741" y="362" text-anchor="middle" font-size="10.5" fill="#1e3a8a" font-weight="700">10 Hz에 필요한 건 0.6 MAC/cycle뿐</text>
