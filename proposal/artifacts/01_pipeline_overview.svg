<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1300" viewBox="0 0 980 1300" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arwR" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="980" height="1300" fill="#ffffff"/>

  <text x="490" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">BinaryMatchboxNet — 전체 파이프라인 (base: C=64, T=128)</text>
  <text x="490" y="60" text-anchor="middle" font-size="13" fill="#64748b">입력 [B,16,128] ∈ {-1,+1}  →  로짓 [B,12].   총 96,524 params (이진 스테이지 58%)</text>

  <!-- input waveform -->
  <rect x="360" y="80" width="260" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="490" y="100" text-anchor="middle" font-size="13" fill="#0f172a">원시 파형  [B, 16000] @ 16 kHz</text>
  <line x1="490" y1="110" x2="490" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- AFE -->
  <rect x="250" y="130" width="480" height="128" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="154" font-size="16" font-weight="700" fill="#1e3a8a">AFE  (아날로그 프론트엔드 시뮬)</text>
  <rect x="628" y="138" width="86" height="22" rx="11" fill="#2563eb"/>
  <text x="671" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">학습가능 thr×16</text>
  <text x="270" y="176" font-size="12" fill="#1e3a8a">① STFT (win 25ms / hop 10ms, n_fft 512)</text>
  <text x="270" y="194" font-size="12" fill="#1e3a8a">② Mel 필터뱅크 16개 (삼각, 50–7500 Hz 등간격 mel)  →  ③ log</text>
  <text x="270" y="212" font-size="12" fill="#1e3a8a">④ 엔벨로프 = 10ms 윈도우 내 max  →  native_T = 100</text>
  <text x="270" y="230" font-size="12" fill="#1e3a8a">⑤ per-clip 전역 min-max → [0,1]   ⑥ 채널별 threshold 비교 (sign-STE)</text>
  <text x="270" y="248" font-size="12" fill="#1e3a8a">⑦ 128 프레임으로 zero-pad (MatchboxNet 4.1)</text>
  <line x1="490" y1="258" x2="490" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- shape pill -->
  <rect x="360" y="280" width="260" height="26" rx="13" fill="#f0fdf4" stroke="#86efac"/>
  <text x="490" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#065f46">[B, 16, 128]   ∈ {-1,+1}  (1-bit)</text>
  <line x1="490" y1="306" x2="490" y2="324" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- conv1 -->
  <g>
    <rect x="290" y="326" width="400" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="310" y="352" font-size="16" font-weight="700" fill="#92400e">Conv1  (prologue)</text>
    <rect x="590" y="336" width="82" height="20" rx="10" fill="#d97706"/>
    <text x="631" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">INT8 weight</text>
    <text x="310" y="374" font-size="12" fill="#92400e">1D conv  k=11, stride 2  ·  16→128 ch  ·  BN → sign(1-bit)  ·  22,784 p</text>
    <text x="310" y="388" font-size="11" fill="#b45309">첫 층은 이진화 금지 — 1-bit 입력을 128ch 연속공간으로 펼쳐 정보손실 완충</text>
  </g>
  <line x1="490" y1="392" x2="490" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="380" y="412" width="220" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="490" y="429" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">[B, 128, 64]  {-1,+1}</text>
  <line x1="490" y1="436" x2="490" y2="452" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- b1 -->
  <g>
    <rect x="290" y="454" width="400" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="310" y="479" font-size="16" font-weight="700" fill="#065f46">B1  이진 TCS ×2  +residual</text>
    <rect x="600" y="463" width="72" height="20" rx="10" fill="#059669"/>
    <text x="636" y="477" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">BINARY</text>
    <text x="310" y="501" font-size="12" fill="#065f46">k=13  ·  128→64 ch  ·  skip: 이진 1×1 투영  ·  23,616 p</text>
  </g>
  <path d="M690,484 C760,484 760,540 690,540" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwR)"/>
  <text x="768" y="514" font-size="10" fill="#dc2626">skip</text>
  <line x1="490" y1="514" x2="490" y2="532" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="380" y="534" width="220" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="490" y="551" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">[B, 64, 64]  {-1,+1}</text>
  <line x1="490" y1="558" x2="490" y2="574" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- b2 -->
  <g>
    <rect x="290" y="576" width="400" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="310" y="601" font-size="16" font-weight="700" fill="#065f46">B2  이진 TCS ×2  +residual</text>
    <rect x="600" y="585" width="72" height="20" rx="10" fill="#059669"/>
    <text x="636" y="599" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">BINARY</text>
    <text x="310" y="623" font-size="12" fill="#065f46">k=15  ·  64→64 ch  ·  skip: identity (정수 ±1 가산)  ·  10,624 p</text>
  </g>
  <path d="M690,606 C760,606 760,662 690,662" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwR)"/>
  <text x="768" y="636" font-size="10" fill="#dc2626">skip</text>
  <line x1="490" y1="636" x2="490" y2="654" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="380" y="656" width="220" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="490" y="673" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">[B, 64, 64]  {-1,+1}</text>
  <line x1="490" y1="680" x2="490" y2="696" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- b3 -->
  <g>
    <rect x="290" y="698" width="400" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="310" y="723" font-size="16" font-weight="700" fill="#065f46">B3  이진 TCS ×2  +residual</text>
    <rect x="600" y="707" width="72" height="20" rx="10" fill="#059669"/>
    <text x="636" y="721" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">BINARY</text>
    <text x="310" y="745" font-size="12" fill="#065f46">k=17  ·  64→64 ch  ·  skip: identity  ·  10,880 p</text>
  </g>
  <path d="M690,728 C760,728 760,784 690,784" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwR)"/>
  <text x="768" y="758" font-size="10" fill="#dc2626">skip</text>
  <line x1="490" y1="758" x2="490" y2="776" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="380" y="778" width="220" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="490" y="795" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">[B, 64, 64]  {-1,+1}</text>
  <line x1="490" y1="802" x2="490" y2="818" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- conv2 -->
  <g>
    <rect x="290" y="820" width="400" height="66" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="310" y="846" font-size="16" font-weight="700" fill="#065f46">Conv2  (epilogue, separable)</text>
    <rect x="600" y="830" width="72" height="20" rx="10" fill="#059669"/>
    <text x="636" y="844" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">BINARY</text>
    <text x="310" y="868" font-size="12" fill="#065f46">separable k=29, dilation 2  ·  64→128 ch  ·  BN → ReLU  ·  10,432 p</text>
    <text x="310" y="882" font-size="11" fill="#047857">다음(conv3)이 비이진 → 여기부터 연속. separable 결정(2026-07-21 승인)</text>
  </g>
  <line x1="490" y1="886" x2="490" y2="904" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="360" y="906" width="260" height="24" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="490" y="923" text-anchor="middle" font-size="12" font-weight="600" fill="#9f1239">[B, 128, 64]  연속값 (fixed-point)</text>
  <line x1="490" y1="930" x2="490" y2="946" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- conv3 -->
  <g>
    <rect x="290" y="948" width="400" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="310" y="973" font-size="16" font-weight="700" fill="#92400e">Conv3</text>
    <rect x="590" y="957" width="82" height="20" rx="10" fill="#d97706"/>
    <text x="631" y="971" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">INT8 weight</text>
    <text x="310" y="995" font-size="12" fill="#92400e">1×1 conv  ·  128→128 ch  ·  BN → ReLU  ·  16,640 p</text>
  </g>
  <line x1="490" y1="1006" x2="490" y2="1024" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="380" y="1026" width="220" height="24" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="490" y="1043" text-anchor="middle" font-size="12" font-weight="600" fill="#9f1239">[B, 128, 64]  연속</text>
  <line x1="490" y1="1050" x2="490" y2="1066" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- conv4 -->
  <g>
    <rect x="290" y="1068" width="400" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="310" y="1093" font-size="16" font-weight="700" fill="#5b21b6">Conv4  (classifier)</text>
    <rect x="586" y="1077" width="86" height="20" rx="10" fill="#7c3aed"/>
    <text x="629" y="1091" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">FIXED-POINT</text>
    <text x="310" y="1115" font-size="12" fill="#5b21b6">1×1 conv  ·  128→12 ch  ·  마지막 층 이진화 금지  ·  1,548 p</text>
  </g>
  <line x1="490" y1="1126" x2="490" y2="1144" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="380" y="1146" width="220" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="490" y="1163" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">[B, 12, 64]</text>
  <line x1="490" y1="1170" x2="490" y2="1186" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- head -->
  <g>
    <rect x="290" y="1188" width="400" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="310" y="1216" font-size="15" font-weight="700" fill="#334155">Head:  시간축 avg pool  →  [B, 12] 로짓  (softmax는 loss)</text>
  </g>

  <!-- legend -->
  <text x="30" y="1270" font-size="12" font-weight="700" fill="#334155">정밀도:</text>
  <rect x="90" y="1258" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="112" y="1271" font-size="12" fill="#334155">INT8 (conv1,3)</text>
  <rect x="215" y="1258" width="16" height="16" rx="3" fill="#d1fae5" stroke="#059669"/><text x="237" y="1271" font-size="12" fill="#334155">이진 (b1–b3, conv2)</text>
  <rect x="380" y="1258" width="16" height="16" rx="3" fill="#ede9fe" stroke="#7c3aed"/><text x="402" y="1271" font-size="12" fill="#334155">fixed-point (conv4)</text>
  <rect x="540" y="1258" width="16" height="16" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="562" y="1271" font-size="12" fill="#334155">AFE</text>
  <line x1="610" y1="1266" x2="640" y2="1266" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/><text x="646" y="1271" font-size="12" fill="#334155">residual(정수)</text>
</svg>
