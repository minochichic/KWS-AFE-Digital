<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="1280" height="860" fill="#ffffff"/>
<text x="640.0" y="34" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="700">비교기 임계 회로 — AFE에서 유일하게 바뀌는 부분</text>
<text x="640.0" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">마이크 · 프리앰프 · GIC 필터 · 검출기는 그대로다. R7/R8 고정 분압만 아래 회로로 교체한다.</text>
<rect x="60" y="100" width="330" height="300" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="76" y="124" text-anchor="start" font-size="13" fill="#dc2626" font-weight="700">A. 다이오드-OR — 지금 가장 큰 채널 찾기</text>
<text x="80" y="166" text-anchor="start" font-size="11" fill="#9a3412" font-weight="700">v_env,0</text>
<polyline points="138,162 284,162" fill="none" stroke="#334155" stroke-width="1.6"/>
<polygon points="287,153 287,171 305,162" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><line x1="305" y1="153" x2="305" y2="171" stroke="#dc2626" stroke-width="2.2"/>
<polyline points="305,162 310,162" fill="none" stroke="#334155" stroke-width="1.6"/>
<circle cx="310" cy="162" r="3.2" fill="#dc2626"/>
<text x="80" y="206" text-anchor="start" font-size="11" fill="#9a3412" font-weight="700">v_env,1</text>
<polyline points="138,202 284,202" fill="none" stroke="#334155" stroke-width="1.6"/>
<polygon points="287,193 287,211 305,202" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><line x1="305" y1="193" x2="305" y2="211" stroke="#dc2626" stroke-width="2.2"/>
<polyline points="305,202 310,202" fill="none" stroke="#334155" stroke-width="1.6"/>
<circle cx="310" cy="202" r="3.2" fill="#dc2626"/>
<text x="80" y="282" text-anchor="start" font-size="11" fill="#9a3412" font-weight="700">v_env,15</text>
<polyline points="138,278 284,278" fill="none" stroke="#334155" stroke-width="1.6"/>
<polygon points="287,269 287,287 305,278" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><line x1="305" y1="269" x2="305" y2="287" stroke="#dc2626" stroke-width="2.2"/>
<polyline points="305,278 310,278" fill="none" stroke="#334155" stroke-width="1.6"/>
<circle cx="310" cy="278" r="3.2" fill="#dc2626"/>
<text x="160" y="243" text-anchor="start" font-size="11" fill="#64748b">⋮   16채널 전부</text>
<polyline points="310,162 310,350" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="326" y="250" text-anchor="start" font-size="10.5" fill="#dc2626" font-weight="700">BAT54 ×16</text>
<text x="326" y="265" text-anchor="start" font-size="9.5" fill="#64748b">(검출기와 동일 부품)</text>
<polyline points="310,350 310,358" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="310" cy="370" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<line x1="310" y1="364" x2="310" y2="376" stroke="#dc2626" stroke-width="1.6"/>
<polygon points="306,370 314,370 310,377" fill="#dc2626"/>
<polyline points="310,382 310,392" fill="none" stroke="#dc2626" stroke-width="2"/>
<line x1="299" y1="392" x2="321" y2="392" stroke="#dc2626" stroke-width="2"/><line x1="303" y1="396" x2="317" y2="396" stroke="#dc2626" stroke-width="2"/><line x1="307" y1="400" x2="313" y2="400" stroke="#dc2626" stroke-width="2"/>
<text x="286" y="374" text-anchor="end" font-size="10.5" fill="#dc2626" font-weight="700">정전류 싱크 ×1</text>
<text x="76" y="142" text-anchor="start" font-size="10.5" fill="#64748b">V_or = V_max − V_d  (강하만큼 낮다)</text>
<rect x="420" y="100" width="300" height="300" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="436" y="124" text-anchor="start" font-size="13" fill="#dc2626" font-weight="700">B. 버퍼 + 다이오드 강하 보상</text>
<text x="436" y="142" text-anchor="start" font-size="10.5" fill="#64748b">op-amp 1개로 뱅크 전체를 담당한다</text>
<polyline points="310,162 470,162 470,207 510,207" fill="none" stroke="#dc2626" stroke-width="2"/>
<polygon points="510,194.0 510,246.0 564,220" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/><text x="521" y="211.0" text-anchor="middle" font-size="12" fill="#0f172a">+</text><text x="521" y="238.0" text-anchor="middle" font-size="12" fill="#0f172a">−</text>
<polyline points="564,220 620,220" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="620" cy="220" r="3.2" fill="#dc2626"/>
<polyline points="620,220 620,286 492,286 492,233 510,233" fill="none" stroke="#dc2626" stroke-width="1.6"/>
<text x="530" y="302" text-anchor="middle" font-size="10" fill="#64748b">피드백</text>
<text x="628" y="212" text-anchor="start" font-size="13" fill="#15803d" font-weight="700">V_max</text>
<text x="628" y="229" text-anchor="start" font-size="9.5" fill="#64748b">(강하 보상됨)</text>
<rect x="436" y="310" width="268" height="72" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="444" y="331" text-anchor="start" font-size="11" fill="#dc2626" font-weight="700">왜 수동 다이오드만으로는 안 되나</text>
<text x="444" y="349" text-anchor="start" font-size="10" fill="#0f172a">다이오드 강하 ~0.25 V ≫ v_env 스윙 ~50 mV.</text>
<text x="444" y="365" text-anchor="start" font-size="10" fill="#0f172a">→ 같은 다이 위의 짝(BAT54WT1)을 기준 경로에 넣어</text>
<text x="444" y="379" text-anchor="start" font-size="10" fill="#0f172a">   온도 드리프트를 상쇄한다.</text>
<rect x="760" y="100" width="460" height="300" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="776" y="124" text-anchor="start" font-size="13" fill="#dc2626" font-weight="700">C. 채널별 분압 + 비교기  (×16)</text>
<text x="776" y="142" text-anchor="start" font-size="10.5" fill="#64748b">R7/R8을 대신하는 부분. 채널마다 저항 2개.</text>
<polyline points="620,220 820,220 820,178" fill="none" stroke="#15803d" stroke-width="2"/>
<text x="820" y="168" text-anchor="middle" font-size="11" fill="#15803d" font-weight="700">V_max</text>
<rect x="811.0" y="184" width="18" height="44" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><text x="836.0" y="204.0" text-anchor="start" font-size="11.5" fill="#0f172a" font-weight="700">Ra_c</text>
<polyline points="820,228 820,250" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="820" cy="250" r="3.2" fill="#dc2626"/>
<rect x="811.0" y="256" width="18" height="44" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><text x="836.0" y="276.0" text-anchor="start" font-size="11.5" fill="#0f172a" font-weight="700">Rb_c</text>
<polyline points="820,300 820,322" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="820" y="338" text-anchor="middle" font-size="11" fill="#15803d" font-weight="700">V_ref</text>
<polygon points="1020,222.0 1020,278.0 1078,250" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><text x="1031" y="240.0" text-anchor="middle" font-size="12" fill="#0f172a">+</text><text x="1031" y="269.0" text-anchor="middle" font-size="12" fill="#0f172a">−</text>
<polyline points="820,250 968,250 968,264 1020,264" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="882" y="241" text-anchor="middle" font-size="11.5" fill="#dc2626" font-weight="700">V_thr,c</text>
<polyline points="950,198 1000,198 1000,236 1020,236" fill="none" stroke="#9a3412" stroke-width="2"/>
<text x="946" y="202" text-anchor="end" font-size="11" fill="#9a3412" font-weight="700">v_env,c</text>
<polyline points="1078,250 1120,250" fill="none" stroke="#334155" stroke-width="2"/>
<text x="1130" y="255" text-anchor="start" font-size="13" fill="#0f172a" font-weight="700">0 / 1</text>
<text x="1049" y="294" text-anchor="middle" font-size="10" fill="#64748b">LPV7215</text>
<rect x="776" y="346" width="428" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="990" y="364" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">V_thr,c  =  α_c · V_max  +  (1 − α_c) · V_ref</text>
<text x="990" y="380" text-anchor="middle" font-size="10.5" fill="#64748b">α_c = Rb_c / (Ra_c + Rb_c)   — 학습이 준 16개 상수</text>
<rect x="60" y="425" width="660" height="120" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="76" y="449" text-anchor="start" font-size="13" fill="#15803d" font-weight="700">D. V_ref — 무음일 때의 바닥</text>
<text x="76" y="471" text-anchor="start" font-size="12.5" fill="#0f172a" font-weight="700">V_ref = (검출기 정지점 917.8 mV) + δ</text>
<text x="76" y="493" text-anchor="start" font-size="11" fill="#0f172a">δ = 전형 음성 엔벨로프 상승의 0.4%  (ML 실측, floor_frac = 0.02)</text>
<text x="76" y="513" text-anchor="start" font-size="11" fill="#0f172a">만드는 법: 입력을 끊은 더미 검출기 1채널 + 작은 오프셋.</text>
<text x="76" y="530" text-anchor="start" font-size="10.5" fill="#64748b">→ 정지점을 자동 추종하므로 온도·공정·전원 변동이 함께 상쇄된다.</text>
<rect x="750" y="425" width="530" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="766" y="449" text-anchor="start" font-size="13" fill="#1e3a8a" font-weight="700">추가 부품 (뱅크 전체)</text>
<text x="766" y="471" text-anchor="start" font-size="10.5" fill="#0f172a">BAT54 다이오드</text>
<text x="916" y="471" text-anchor="end" font-size="10.5" fill="#0f172a" font-weight="700">16 + 1</text>
<text x="932" y="471" text-anchor="start" font-size="10" fill="#64748b">OR용 16개 + 강하 보상 1개</text>
<text x="766" y="489" text-anchor="start" font-size="10.5" fill="#0f172a">op-amp (버퍼)</text>
<text x="916" y="489" text-anchor="end" font-size="10.5" fill="#0f172a" font-weight="700">1</text>
<text x="932" y="489" text-anchor="start" font-size="10" fill="#64748b">뱅크 공유</text>
<text x="766" y="507" text-anchor="start" font-size="10.5" fill="#0f172a">정전류 싱크</text>
<text x="916" y="507" text-anchor="end" font-size="10.5" fill="#0f172a" font-weight="700">1</text>
<text x="932" y="507" text-anchor="start" font-size="10" fill="#64748b">OR 노드 풀다운</text>
<text x="766" y="525" text-anchor="start" font-size="10.5" fill="#0f172a">저항 Ra / Rb</text>
<text x="916" y="525" text-anchor="end" font-size="10.5" fill="#0f172a" font-weight="700">32</text>
<text x="932" y="525" text-anchor="start" font-size="10" fill="#64748b">채널당 2개 — R7/R8 자리를 대체</text>
<rect x="60" y="575" width="1160" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="76" y="599" text-anchor="start" font-size="13" fill="#0f172a" font-weight="700">무엇이 바뀌나 — 한 장 요약</text>
<text x="150" y="627" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700">기존 (고정 임계)</text>
<text x="150" y="651" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">1.8V ─[R7]─┬─[R8]─ GND</text>
<text x="150" y="669" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">           │</text>
<text x="150" y="687" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">        V_thr (고정)</text>
<text x="460" y="659" text-anchor="middle" font-size="26" fill="#dc2626" font-weight="700">→</text>
<text x="750" y="627" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">새로 (상대 임계)</text>
<text x="750" y="651" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">V_max ─[Ra]─┬─[Rb]─ V_ref</text>
<text x="750" y="669" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">            │</text>
<text x="750" y="687" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">         V_thr (지금 최대의 α배)</text>
<text x="640.0" y="745" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">임계가 고정 전압이 아니라 '지금 이 순간 16채널 중 최대'를 따라가므로, 말하는 사람과 거리가 바뀌어도 이진 이미지가 그대로다.</text>
<text x="640.0" y="768" text-anchor="middle" font-size="11.5" fill="#64748b">음량이 분자·분모에서 약분되기 때문이고, AGC와 달리 피드백 루프가 없어 발진·어택/릴리즈·첫 단어 문제가 없다.</text>
<text x="60" y="836" text-anchor="start" font-size="10.5" fill="#64748b">α 16개 값 = proposal/artifacts/channel_table.md   ·   전력 순증 ≈ −30 µW (분압이 1.8 V가 아니라 ~0.1 V에만 걸린다)</text>
</svg>